# Runs on every pull request and on pushes to main (spec 14.2: tests and dependency scanning on every PR).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: plugev-api (core API)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugev-api
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: plugev_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/plugev_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugev-api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency audit (fails on high or critical)
        run: npm audit --omit=dev --audit-level=high

  gateway:
    name: plugev-server (OCPP gateway PoC)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugev-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugev-server/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Dependency audit (fails on high or critical)
        run: npm audit --omit=dev --audit-level=high

  admin:
    name: plugev-admin (admin portal)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugev-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugev-admin/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency audit (fails on high or critical)
        run: npm audit --omit=dev --audit-level=high

  portal:
    name: plugev-portal (Phase 0 portal)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugev-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugev-portal/package-lock.json
      # The template's dependency tree has peer conflicts (see instructions.txt); the new portal (ADR-005) will not.
      - run: npm ci --force
      - run: npx react-scripts test --watchAll=false
        env:
          CI: "true"
      # Report only: the template has known vulnerable packages and is being replaced in Phase 2.
      - name: Dependency audit (report only)
        run: npm audit --omit=dev --audit-level=high || true

  docker:
    name: Docker images + compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Throwaway secrets for this run
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "JWT_ACCESS_SECRET=$(openssl rand -hex 32)"
            echo "MFA_ENCRYPTION_KEY=$(openssl rand -base64 32)"
          } > .env
      - name: Build images and start the stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test
        run: |
          set -euo pipefail
          curl -fsS localhost:4000/api/v1/health/ready
          curl -fsS localhost:3003/api/health
          # Admin portal: page served, with its Content Security Policy pointing at the API
          admin=$(curl -fsS localhost:8080/login)
          [[ "$admin" == *'<div id="root">'* ]]
          csp=$(curl -fsSI localhost:8080/ | tr -d '\r' | grep -i '^content-security-policy:')
          echo "$csp"
          [[ "$csp" == *"connect-src 'self' http://localhost:4000"* ]]
          # Phase 0 portal (charger console)
          portal=$(curl -fsS localhost:8081/)
          [[ "$portal" == *'<div id="root">'* ]]
          # The browser at the admin portal may call the API (CORS)
          cors=$(curl -fsS -o /dev/null -D - -X OPTIONS localhost:4000/api/v1/auth/login \
            -H 'Origin: http://localhost:8080' -H 'Access-Control-Request-Method: POST' | tr -d '\r')
          [[ "$cors" == *'access-control-allow-origin: http://localhost:8080'* ]] || [[ "$cors" == *'Access-Control-Allow-Origin: http://localhost:8080'* ]]
          docker compose exec -T -e SUPER_ADMIN_PASSWORD='ci smoke passphrase' api \
            node dist/cli/create-super-admin.js --email ci@plugev.test --name "CI Smoke"
          login=$(curl -fsS -X POST localhost:4000/api/v1/auth/login -H 'content-type: application/json' \
            -d '{"email":"ci@plugev.test","password":"ci smoke passphrase"}')
          echo "$login"
          # The new Super Admin must be sent to MFA setup, not signed in
          [[ "$login" == *'"status":"mfa_enrollment_required"'* ]]
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down -v
